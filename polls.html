<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Polls</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="polls.css">
</head>
<body>
    <div class="bg-glow glow-one"></div>
    <div class="bg-glow glow-two"></div>
    <header class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </span>
            <span>Campus<span>Connect</span></span>
        </a>
        <nav class="nav-links">
            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
            <a href="posts.html">
                <i class="fa-solid fa-users"></i>
                Community
            </a>
            <a href="events.html">
                <i class="fa-solid fa-calendar-days"></i>
                Events
            </a>
            <a href="studypartners.html">
                <i class="fa-solid fa-user-group"></i>
                Study Partners
            </a>
            <a href="polls.html" class="active">
                <i class="fa-solid fa-square-poll-vertical"></i>
                Polls
            </a>
        </nav>
       <div class="nav-actions">
            <button class="icon-btn"><a href="notification.html">
                <i class="fa-regular fa-bell"></i></a>
                <span class="notification-dot"></span>
            </button>
            <a href="profile.html" class="profile-mini">
                <div class="avatar" id="userAvatar"></div>
                <div class="profile-mini-text">
                    <strong id="navUserName"></strong>
                    <small>Student</small>
                </div>
            </a>
            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>
    <main class="polls-container">
        <div class="page-heading">
            <span class="small-label">
                <i class="fa-solid fa-square-poll-vertical"></i>
                COMMUNITY VOICE
            </span>
            <h1>Community Polls</h1>
            <p>
                Share your opinion and see what the campus community thinks.
            </p>
        </div>
        <div class="poll-toolbar">
            <div class="poll-tabs">
                <button class="poll-tab active">
                    All Polls
                </button>
                <button class="poll-tab">
                    Trending
                </button>
                <button class="poll-tab">
                    My Polls
                </button>
            </div>
            <button class="gradient-btn" id="createPollBtn">
                <i class="fa-solid fa-plus"></i>
                Create Poll
            </button>
        </div>
        <section class="polls-grid" id="pollsContainer">
        </section>
    </main>
    <div class="poll-modal" id="pollModal">
        <div class="poll-modal-content">
            <div class="modal-header">
                <div>
                    <span class="small-label">
                        COMMUNITY VOICE
                    </span>
                    <h2>Create a Poll</h2>
                </div>
                <button type="button" class="close-modal" id="closePollModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="createPollForm">
                <div class="form-group">
                    <label for="pollQuestion">
                        Poll Question
                    </label>
                    <input type="text" id="pollQuestion" placeholder="Ask your campus a question..." required>
                </div>
                <div class="form-group">
                    <label for="pollOption1">
                        Option 1
                    </label>
                    <input type="text" id="pollOption1" placeholder="Enter first option" required>
                </div>
                <div class="form-group">
                    <label for="pollOption2">
                        Option 2
                    </label>
                    <input type="text" id="pollOption2" placeholder="Enter second option" required>
                </div>
                <div class="form-group">
                    <label for="pollOption3">
                        Option 3
                    </label>
                    <input type="text" id="pollOption3" placeholder="Enter third option">
                </div>
                <div class="form-group">
                    <label for="pollOption4">
                        Option 4
                    </label>
                    <input type="text" id="pollOption4" placeholder="Enter fourth option">
                </div>
                <div class="form-group">
                    <label for="pollExpiry">
                        Expiry Date & Time
                    </label>
                    <input type="datetime-local" id="pollExpiry">
                </div>
                <button type="submit" class="gradient-btn">
                    <i class="fa-solid fa-plus"></i>
                    Create Poll
                </button>
            </form>
        </div>
    </div>
    <footer class="footer">
        <p>
            © 2026 CampusConnect.
            <span>Connect • Learn • Grow</span>
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="polls.js"></script>
        <script src="dashboard.js"></script>

</body>
</html>
