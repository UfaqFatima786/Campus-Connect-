<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="events.css">

</head>

<body>
    <div class="bg-glow glow-one"></div>
    <div class="bg-glow glow-two"></div>
    <header class="navbar">
        <a href="dashboard.html" class="logo">
            <span class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </span>
            <span>Campus<span>Connect</span></span>
        </a>
        <nav class="nav-links">
            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
            <a href="posts.html">
                <i class="fa-solid fa-users"></i>
                Community
            </a>
            <a href="events.html" class="active">
                <i class="fa-solid fa-calendar-days"></i>
                Events
            </a>
            <a href="studypartners.html">
                <i class="fa-solid fa-user-group"></i>
                Study Partners
            </a>
            <a href="polls.html">
                <i class="fa-solid fa-square-poll-vertical"></i>
                Polls
            </a>
        </nav>
        <div class="nav-actions">
            <button class="icon-btn">
                <i class="fa-regular fa-bell"></i>
            </button>
            <a href="profile.html" class="profile-mini">
                <div class="avatar" id="userAvatar"></div>
                <div class="profile-mini-text">
                    <strong id="navUserName"></strong>
                    <small>Student</small>
                </div>
            </a>
            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>
    <main class="events-container">
        <div class="page-heading">
            <span class="small-label">
                <i class="fa-solid fa-calendar-star"></i>
                CAMPUS ACTIVITIES
            </span>
            <h1>Discover Events</h1>
            <p>
                Discover workshops, meetups and exciting activities
                happening around your campus.
            </p>
        </div>
        <div class="event-toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search events...">
            </div>
            <select class="filter-select">
                <option>All Events</option>
                <option>Workshops</option>
                <option>Meetups</option>
                <option>Seminars</option>
            </select>
            <button class="gradient-btn">
                <i class="fa-solid fa-plus"></i>
                Create Event
            </button>
        </div>
        <section class="events-grid" id="eventsContainer">

    </main>

    <div class="event-modal" id="eventModal">

        <div class="event-modal-content">

            <button class="close-modal" id="closeEventModal">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-heading">

                <span>
                    <i class="fa-solid fa-calendar-plus"></i>
                </span>

                <div>
                    <h2>Create New Event</h2>
                    <p>Share an exciting event with your campus.</p>
                </div>

            </div>


            <form id="createEventForm">

                <div class="form-group">

                    <label for="eventTitle">
                        Event Title
                    </label>

                    <input type="text" id="eventTitle" placeholder="Enter event title" required>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="eventCategory">
                            Category
                        </label>

                        <select id="eventCategory" required>

                            <option value="">
                                Select category
                            </option>

                            <option value="Workshop">
                                Workshop
                            </option>

                            <option value="Meetup">
                                Meetup
                            </option>

                            <option value="Seminar">
                                Seminar
                            </option>

                            <option value="Networking">
                                Networking
                            </option>

                            <option value="Sports">
                                Sports
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="eventLocation">
                            Location
                        </label>

                        <input type="text" id="eventLocation" placeholder="e.g. Main Hall" required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="eventDate">
                            Date
                        </label>

                        <input type="date" id="eventDate" required>

                    </div>


                    <div class="form-group">

                        <label for="eventTime">
                            Time
                        </label>

                        <input type="time" id="eventTime" required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="eventDescription">
                        Description
                    </label>

                    <textarea id="eventDescription" rows="4" placeholder="Tell students about this event..."
                        required></textarea>

                </div>


                <div class="form-group">

                    <label for="eventImage">
                        Event Image
                    </label>

                    <input type="file" id="eventImage" accept="image/*">

                </div>


                <button type="submit" class="gradient-btn modal-submit-btn">

                    <i class="fa-solid fa-plus"></i>

                    Create Event

                </button>

            </form>

        </div>

    </div>
    <footer class="footer">
        <p>
            © 2026 CampusConnect.
            <span>Connect • Learn • Grow</span>
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="events.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
